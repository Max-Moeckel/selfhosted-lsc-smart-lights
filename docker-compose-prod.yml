# Production compose used by the Gitea CI deploy (.gitea/workflows/deploy.yaml).
#
# The runner builds inside an ephemeral checkout and talks to the host Docker daemon
# over the mounted socket. Bind-mount sources are therefore resolved by the HOST, so
# config must come from an ABSOLUTE host path — a workspace-relative ./config would
# point at a path that doesn't exist on the host. LSC_CONFIG_DIR is the absolute path
# to the dir with the real devices/wakeup/settings json; it comes from the repo's
# Gitea Actions variable (passed through by .gitea/workflows/deploy.yaml).
services:
  lsc-web:
    build: .
    image: lsc-web:latest
    container_name: lsc-web
    restart: unless-stopped
    ports:
      - "8089:8080"
    volumes:
      - ${LSC_CONFIG_DIR:?set the LSC_CONFIG_DIR Gitea Actions variable}/devices.json:/app/config/devices.json:ro
      - ${LSC_CONFIG_DIR:?set the LSC_CONFIG_DIR Gitea Actions variable}/wakeup.json:/app/config/wakeup.json
      - ${LSC_CONFIG_DIR:?set the LSC_CONFIG_DIR Gitea Actions variable}/settings.json:/app/config/settings.json
