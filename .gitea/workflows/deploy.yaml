name: deploy
run-name: Deploy smart-light to Synology 💡

# Build the image and (re)start the container whenever main changes.
on:
  push:
    branches: [main]

# Never let two deploys overlap; let a running one finish rather than cancel it.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    container:
      image: catthehacker/ubuntu:act-latest   # has docker CLI + compose; talks to the host daemon
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build from this checkout (the build context is streamed to the host daemon)
      # and recreate the container. Config is bind-mounted from an absolute host path
      # via docker-compose-prod.yml, so it survives the ephemeral workspace. --wait
      # blocks until the container's healthcheck passes and fails the deploy otherwise.
      - name: Build and deploy
        env:
          # Absolute host path to the config dir, from the repo's Gitea Actions
          # variable (Settings → Actions → Variables). docker compose reads it for
          # ${LSC_CONFIG_DIR} interpolation in docker-compose-prod.yml.
          LSC_CONFIG_DIR: ${{ vars.LSC_CONFIG_DIR }}
        run: |
          docker compose -f docker-compose-prod.yml build
          docker compose -f docker-compose-prod.yml up -d --remove-orphans --wait --wait-timeout 120 \
            || { docker compose -f docker-compose-prod.yml logs --tail=80; exit 1; }
          docker image prune -f
