services:
  lsc-web:
    build: .
    image: lsc-web:latest
    container_name: lsc-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Runtime config (device local keys + wake-up settings) lives on the host and
      # is bind-mounted read-write — never baked into the image. The web UI persists
      # wake-up settings back into this directory.
      - ./config:/app/config
