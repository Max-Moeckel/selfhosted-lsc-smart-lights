services:
  lsc-web:
    build: .
    image: lsc-web:latest
    container_name: lsc-web
    restart: unless-stopped
    # Cap resources (applied by `docker compose up` on Compose v2).
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 500M
    # Mark the container healthy only while the app actually serves (slim image has
    # no curl/wget, so use Python's urllib — urlopen raises on a bad status/refusal).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    ports:
      - "8080:8080"
    volumes:
      # Device local keys: read-only, and never baked into the image (kept out of the
      # build context by .dockerignore) — only ever mounted from the host.
      - ./config/devices.json:/app/config/devices.json:ro
      # Wake-up settings: writable so the web UI can persist them.
      - ./config/wakeup.json:/app/config/wakeup.json
      # Scene profiles: writable so UI-edited profiles can be persisted (future).
      - ./config/settings.json:/app/config/settings.json
